# Mango — an independently installable financial-research toolkit.
#
# It began as an extension pack overlaid onto a third-party checkout. The
# package namespace was renamed from `terminalq` to `mango` once the last hard
# dependency on that project was removed, so the distribution no longer occupies
# another project's name.

[project]
name = "mango"
version = "0.1.0"
description = "Free-data market providers, historical-context analytics, deterministic report rendering, and a self-grading prediction ledger"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Matches TerminalQ's own ruff settings — this code is overlaid into that tree,
# so it should lint and format identically to the surrounding modules.
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mango*"]
