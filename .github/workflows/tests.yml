name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Mango is a standalone package. CI used to check out a third-party host
      # project and overlay this code onto it, because the package imported that
      # project's cache, config, logging and base providers. Those are all owned
      # now, so CI installs and tests Mango on its own — which is also what
      # proves the independence claim rather than asserting it.
      - name: Check out Mango
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run the test suite
        run: python -m pytest tests -q

      # Tests that exercise host-project wiring skip rather than fail when no
      # host is present (see tests/_upstream_wiring.py). That is correct, but it
      # would also hide a genuine collection break, so assert the suite actually
      # ran a substantial number of tests rather than silently skipping most.
      - name: Fail if most of the suite skipped
        run: |
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pytest", "tests", "-q"],
                               capture_output=True, text=True).stdout
          m = re.search(r"(\d+) passed", out)
          passed = int(m.group(1)) if m else 0
          print(f"{passed} tests passed")
          if passed < 300:
              sys.exit(f"only {passed} tests passed — expected the full suite; "
                       "a collection error may be masquerading as skips")
          PY

      - name: Confirm no hard dependency on the host project
        run: |
          # Guarded, optional imports are fine — they are wrapped in try/except
          # so the package still imports standalone. An unguarded one is not.
          if grep -rn --include="*.py" "^from terminalq\|^import terminalq" src/; then
            echo "Unguarded host import found at module top level (see above)."
            exit 1
          fi
          echo "No top-level host imports."
