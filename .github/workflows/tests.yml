name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN. Without this block the token inherits the
# repository default, which for repos created before Feb 2023 is read-WRITE —
# so a compromised dependency or action in this workflow could push commits.
# These tests only need to read the checked-out code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Mango
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run the test suite
        run: python -m pytest tests -q

      # Guard against a collection error masquerading as skips: assert the suite
      # actually ran a substantial number of tests.
      - name: Fail if most of the suite skipped
        run: |
          python - <<'PY'
          import re, subprocess, sys
          out = subprocess.run([sys.executable, "-m", "pytest", "tests", "-q"],
                               capture_output=True, text=True).stdout
          m = re.search(r"(\d+) passed", out)
          passed = int(m.group(1)) if m else 0
          print(f"{passed} tests passed")
          if passed < 300:
              sys.exit(f"only {passed} tests passed — expected the full suite; "
                       "a collection error may be masquerading as skips")
          PY
